name: Daily MND/Treasury ingestion (8 AM ET)

# Target: first attempt at 8:00 AM ET, retry at 8:45 AM ET. Running in the
# morning because MND's closes are finalized/displayed the next day.
# GitHub Actions cron is UTC-only and doesn't shift for daylight saving, so
# each attempt gets two cron lines - one for EDT (UTC-4) and one for EST
# (UTC-5). That means this fires 4x on any given weekday, but only 2 of
# those 4 are ever "real" for the current season; the other 2 land an hour
# off and are harmless no-ops once the day's row already exists
# (nightly_job.py's skip-if-complete check makes an off-season or retry
# firing a fast exit rather than a wasted re-fetch). Day-of-week is 1-5
# (Mon-Fri UTC) because 8 AM ET is the same UTC calendar day.
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 8:00 AM EDT
    - cron: '0 13 * * 1-5'   # 8:00 AM EST
    - cron: '45 12 * * 1-5'  # 8:45 AM EDT retry
    - cron: '45 13 * * 1-5'  # 8:45 AM EST retry
  workflow_dispatch: {}     # manual trigger for testing / catch-up runs

permissions:
  contents: write

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly ingestion job
        run: python nightly_job.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnd_spreads.db
          if git diff --cached --quiet; then
            echo "No changes to commit (row already existed, or job made no writes)."
          else
            git commit -m "Nightly data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
