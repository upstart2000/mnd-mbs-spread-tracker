name: Daily MND/Treasury ingestion (5 AM ET)

# Target: first attempt at 5:00 AM ET, retries at 6:00 and 7:00 AM ET. Running
# in the early morning because MND's closes are finalized/displayed overnight.
# GitHub Actions cron is UTC-only and doesn't shift for daylight saving, so
# the three ET times need four UTC lines to cover both EDT (UTC-4) and EST
# (UTC-5). Off-season firings are harmless no-ops once the day's row exists
# (nightly_job.py's skip-if-complete check makes them fast exits rather than
# wasted re-fetches). Day-of-week is 1-5 (Mon-Fri UTC) because 5-7 AM ET is
# the same UTC calendar day.
on:
  schedule:
    - cron: '0 9 * * 1-5'    # 5:00 AM EDT (off-season: 4:00 AM EST no-op)
    - cron: '0 10 * * 1-5'   # 6:00 AM EDT / 5:00 AM EST
    - cron: '0 11 * * 1-5'   # 7:00 AM EDT / 6:00 AM EST
    - cron: '0 12 * * 1-5'   # 7:00 AM EST (off-season: 8:00 AM EDT no-op)
  workflow_dispatch: {}     # manual trigger for testing / catch-up runs

permissions:
  contents: write

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly ingestion job
        run: python nightly_job.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnd_spreads.db
          if git diff --cached --quiet; then
            echo "No changes to commit (row already existed, or job made no writes)."
          else
            git commit -m "Nightly data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
